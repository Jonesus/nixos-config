# Weekly PR that updates flake.lock, but only to versions at least 7 days old
# (see scripts/update-flake-aged.sh), after checking that every host still
# builds with them. Review the PR, merge, then pull and `nh os switch` locally.
name: Update flake inputs

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Minimum age of new versions, in days (0 = latest)"
        default: "7"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each host's closure is ~10 GB unpacked; the runner's preinstalled
      # toolchains leave too little room for both.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # Same caches as modules/nixos/base.nix, so noctalia isn't compiled.
          extra_nix_config: |
            extra-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      - name: Update inputs older than ${{ inputs.days || 7 }} days
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days || 7 }}
        run: |
          scripts/update-flake-aged.sh "$DAYS" > "$RUNNER_TEMP/summary.md"
          if [ -s "$RUNNER_TEMP/summary.md" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check the flake and build every host
        id: verify
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: |
          nix flake check --no-build
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::Build $host"
            nix build --no-link --print-build-logs ".#nixosConfigurations.$host.config.system.build.toplevel"
            echo "::endgroup::"
          done

      - name: Add the build result to the PR description
        if: steps.update.outputs.changed == 'true'
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo
            if [ "$OUTCOME" = success ]; then
              echo "✅ \`nix flake check\` passes and every host builds ([run]($RUN_URL))."
            else
              echo "❌ **Doesn't build. Don't merge.** See [the run]($RUN_URL) for the error."
            fi
          } >> "$RUNNER_TEMP/summary.md"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.update.outputs.changed == 'true'
        with:
          branch: flake-update-aged
          delete-branch: true
          commit-message: "flake.lock: update inputs"
          title: "${{ steps.verify.outcome == 'success' && 'flake.lock: update inputs' || '[build failing] flake.lock: update inputs' }}"
          body-path: ${{ runner.temp }}/summary.md

      - name: Fail the run if the update doesn't build
        if: steps.verify.outcome == 'failure'
        run: exit 1
