# Weekly PR that updates flake.lock, but only to versions at least 7 days old
# (see scripts/update-flake-aged.sh). Review the PR, merge, then pull and
# `nh os switch` locally.
name: Update flake inputs (7-day cooldown)

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Update inputs older than 7 days
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/update-flake-aged.sh 7 > "$RUNNER_TEMP/summary.md"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: flake-update-aged
          delete-branch: true
          commit-message: "flake.lock: update inputs (7-day cooldown)"
          title: "flake.lock: update inputs (7-day cooldown)"
          body-path: ${{ runner.temp }}/summary.md
